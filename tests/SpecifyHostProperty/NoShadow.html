<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With Slash</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
        import 'xtal-element/index.js';
    </script>
</head>
<body>
    <mood-stone itemscope>
        <div>
            <span itemprop=isHappy></span>
        </div>
        <input id=test
            disabled 
            type=checkbox  
            🔭='isHappy.'
        >
        <xtal-element
            prop-defaults='{
                "isHappy": true
            }'
            xform='{
                "| isHappy": 0
            }'
        ></xtal-element>
    </mood-stone>
    <div id=target></div>
    <script>
        function runTest(){
            if(test.checked){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runTest();
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>With Slash</title>
    <!-- #include virtual="/imports.html" -->

    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <input name=search type=search>

    <div id=test 🔭='@search then ON{
        "?": "Searching...",
        ":": "How can I help you today?",
        "hi": "hello"
    }'></div>

    <div id=target></div>

    <script>
        function runTest(){
            if(test.textContent === 'How can I help you today?'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runTest();
        }, 1500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script > Global > append world (custom handler)</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <input id=searchString type=search>

    <div 🔭='#searchString then JS{
        e.r = e.args[0] + " World"
    }'></div>
</body>
</html>

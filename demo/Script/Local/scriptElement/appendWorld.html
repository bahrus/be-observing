<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script > Local > script element > append world (punt)</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <div>
        <input id=searchString type=search>
    
        <div id=output 🔭='#searchString then punt.'></div>
        <script>
            output.addEventListener('🔭', e => {
                output.textContent = e.detail.args[0] + ' World';
            });
        </script>
    </div>
</body>
</html>

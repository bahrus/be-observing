<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script > Local > inline > append world</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <div>
        <input id=searchString type=search>
    
        <div 🔭='#searchString then JS{
            textContent = e.f.searchString + " world"
        }'></div>
    </div>
</body>
</html>

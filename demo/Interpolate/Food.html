<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer element > by ID > interpolate</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
        class FoodDisplay extends HTMLElement{
            propagator = new EventTarget();
            #myProp;
            get myProp(){
                return this.#myProp;
            }
            set myProp(nv){
                this.#myProp = nv;
                this.shadowRoot.querySelector('#output').textContent = nv ?? '';
                this.propagator.dispatchEvent(new Event('myProp'));
            }
            constructor(){
                super();
                this.attachShadow({mode: 'open'});
                this.shadowRoot.innerHTML = '<span id=output></span>';
            }
        }
        customElements.define('food-display', FoodDisplay);
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>

    <label>name <input id=name></label>
    <label>food <input id=food></label>

    <food-display enh-🔭='#name and #food and set myProp to `${0} eats ${1}`.'></food-display>
</body>
</html>

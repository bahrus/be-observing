<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Properties Explicitly > Checkbox to Form Element's element</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'xtal-element/index.js';
        import '/🔭.js';
    </script>
</head>
<body>
    <input id=sourceCheckbox type=checkbox>

    <form 🔭='#sourceCheckbox and set ?.elements?.destCheckbox?.checked.
    '>
        <input name=destCheckbox type=checkbox>
    </form>
</body>
</html>

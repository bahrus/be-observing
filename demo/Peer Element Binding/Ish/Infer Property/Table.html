<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Element Binding > By CE Name > Infer Property > table</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import '/🔭.js';
        import {Scope, regIsh} from 'trans-render/froop/Scope.js';
        class Simple extends Scope {
            static config = {
                propInfo: {
                    prop1: {
                        def: 'hello'
                    },
                    prop2: {
                        def: 'goodbye'
                    }
                }
            }
        }
        Simple.bootUp();
        regIsh(document.body, 'my-item', Simple);
    </script>
</head>
<body>

    <table>
        <tr itemscope=my-item>
            <td>
                <div itemprop=prop1 🔭></div>
            </td>
            <td>
                <div itemprop=prop2 🔭></div>
            </td>
        </tr>
        <tr itemscope=my-item>
            <td>
                <div itemprop=prop1 🔭></div>
            </td>
            <td>
                <div itemprop=prop2 🔭></div>
            </td>
        </tr>
    </table>
</body>
</html>

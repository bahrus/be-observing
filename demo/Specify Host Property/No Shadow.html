<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specify Host Property - No Shadow</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement{
            propagator = new EventTarget();
            #isHappy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                const el = this.querySelector('[itemprop=isHappy]');
                if (el) el.textContent = String(nv);
                this.propagator.dispatchEvent(new Event('isHappy'));
            }
            connectedCallback(){
                this.isHappy = true;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <mood-stone itemscope>
        <div>
            <span itemprop=isHappy></span>
        </div>
        <input 
            disabled 
            type=checkbox  
            🔭='isHappy.'
        >
    </mood-stone>
</body>
</html>

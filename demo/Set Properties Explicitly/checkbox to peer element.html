<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Properties Explicitly > Checkbox to Peer Element</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement{
            propagator = new EventTarget();
            #isHappy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                const span = this.shadowRoot.querySelector('#display');
                if (span) span.textContent = String(nv);
                this.propagator.dispatchEvent(new Event('isHappy'));
            }
            connectedCallback(){
                this.isHappy = true;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <input id=someCheckbox type=checkbox>

    <mood-stone enh-🔭='#someCheckbox and set isHappy.'>
        <template shadowrootmode=open>
            <div>
                isHappy: <span id=display></span>
            </div>
            <be-hive></be-hive>
        </template>
    </mood-stone>
</body>
</html>

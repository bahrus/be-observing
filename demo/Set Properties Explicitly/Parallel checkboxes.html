<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Props > in parallel</title>
    <!-- #include virtual="/imports.html" -->

    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement{
            propagator = new EventTarget();
            #isHappy;
            #isWealthy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                const el = this.shadowRoot.querySelector('#happyDisplay');
                if (el) el.textContent = String(nv);
                this.propagator.dispatchEvent(new Event('isHappy'));
            }
            get isWealthy(){
                return this.#isWealthy;
            }
            set isWealthy(nv){
                this.#isWealthy = nv;
                const el = this.shadowRoot.querySelector('#wealthyDisplay');
                if (el) el.textContent = String(nv);
                this.propagator.dispatchEvent(new Event('isWealthy'));
            }
            connectedCallback(){
                this.isHappy = true;
                this.isWealthy = false;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="be-observing/🔭.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <input id=someCheckbox type=checkbox>
    <input id=someOtherCheckbox type=checkbox>

    <mood-stone enh-🔭='#someCheckbox and set isHappy.
        #someOtherCheckbox and set isWealthy.'>
        <template shadowrootmode=open>
            <div>
                is happy: <span id=happyDisplay></span>
            </div>
            <div>
                is wealthy: <span id=wealthyDisplay></span>
            </div>
            <be-hive></be-hive>
        </template>
    </mood-stone>
</body>
</html>
